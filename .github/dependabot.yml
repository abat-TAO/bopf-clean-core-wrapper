version: 2

updates:
  # abaplint (package.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope

  # The actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:00'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
